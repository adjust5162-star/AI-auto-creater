<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 영상 제작 콘솔</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <p class="eyebrow">AI Auto Creater</p>
          <h1>AI 영상 제작</h1>
        </div>
        <div class="metrics" id="metrics"></div>
      </header>

      <div id="message" class="message hidden" role="status"></div>

      <div class="workspace-grid">
        <aside class="sidebar">
          <section class="panel creator-panel">
            <div class="section-title">
              <span class="icon-square">+</span>
              <h2>빠른 제작</h2>
            </div>
            <form id="project-form" class="form-stack">
              <div class="field-group">
                <div class="field-group-title">기본</div>
                <label>
                  제목
                  <input name="title" required placeholder="예: 신제품 소개 영상" />
                </label>
                <div class="two-col">
                  <label>
                    유형
                    <select name="contentType">
                      <option value="educational">교육</option>
                      <option value="news">뉴스 요약</option>
                      <option value="product">제품 소개</option>
                      <option value="healthcare">헬스케어</option>
                      <option value="shorts">쇼츠</option>
                      <option value="slideshow">슬라이드</option>
                    </select>
                  </label>
                  <label>
                    화면비
                    <select name="aspectRatio">
                      <option value="vertical">9:16</option>
                      <option value="landscape">16:9</option>
                    </select>
                  </label>
                </div>
                <div class="two-col">
                  <label>
                    길이(초)
                    <input name="targetDuration" type="number" min="15" max="180" value="45" required />
                  </label>
                  <label>
                    브랜드 색
                    <input name="brandColor" type="color" value="#216ce7" required />
                  </label>
                </div>
              </div>

              <div class="field-group">
                <div class="field-group-title">소스</div>
                <label>
                  대본/스크립트
                  <textarea name="sourceText" rows="6" placeholder="대본, 기사 본문, 핵심 메시지"></textarea>
                </label>
                <label>
                  URL
                  <input name="sourceUrl" placeholder="이미지, 영상, 문서 URL" />
                </label>
                <div class="two-col">
                  <label>
                    이미지
                    <input name="image" type="file" accept="image/*" multiple />
                  </label>
                  <label>
                    영상
                    <input name="video" type="file" accept="video/*" multiple />
                  </label>
                </div>
                <label>
                  오디오
                  <input name="audio" type="file" accept="audio/*" />
                </label>
              </div>

              <div class="field-group">
                <div class="field-group-title">출력</div>
                <div class="two-col">
                  <label>
                    음성
                    <select name="voice">
                      <option value="clear-ko">Clear KO</option>
                      <option value="warm-ko">Warm KO</option>
                      <option value="documentary">Documentary</option>
                    </select>
                  </label>
                  <label>
                    자막
                    <select name="subtitlePreset">
                      <option value="bold-bottom">Bold Bottom</option>
                      <option value="clean-center">Clean Center</option>
                      <option value="compact-news">Compact News</option>
                    </select>
                  </label>
                </div>
                <label class="checkbox-row">
                  <input name="autoRender" type="checkbox" checked />
                  바로 렌더링
                </label>
              </div>

              <button class="primary-button" type="submit">영상 만들기</button>
            </form>
          </section>

          <section class="panel">
            <div class="section-title row-between">
              <div class="title-row">
                <span class="icon-square">P</span>
                <h2>작업 목록</h2>
              </div>
              <button class="icon-button" id="refresh-projects" type="button" title="새로고침" aria-label="새로고침">↻</button>
            </div>
            <div id="project-list" class="project-list"></div>
          </section>
        </aside>

        <section id="studio" class="studio work-surface">
          <div class="empty-state">
            <div class="empty-icon">AI</div>
            <h2>새 작업을 시작하세요</h2>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
