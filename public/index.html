<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Video Automation Studio</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">AI Video Automation Studio</p>
          <h1>동영상 자동 제작 워크벤치</h1>
        </div>
        <div class="metrics" id="metrics"></div>
      </header>

      <div id="message" class="message hidden" role="status"></div>

      <div class="workspace-grid">
        <aside class="sidebar">
          <section class="panel">
            <div class="section-title">
              <span class="icon-square">+</span>
              <h2>새 프로젝트</h2>
            </div>
            <form id="project-form" class="form-stack">
              <label>
                제목
                <input name="title" required placeholder="예: 생성형 AI 쇼츠" />
              </label>
              <div class="two-col">
                <label>
                  유형
                  <select name="contentType">
                    <option value="educational">교육</option>
                    <option value="news">뉴스 요약</option>
                    <option value="product">제품 소개</option>
                    <option value="healthcare">헬스케어</option>
                    <option value="shorts">숏폼</option>
                    <option value="slideshow">슬라이드쇼</option>
                  </select>
                </label>
                <label>
                  화면비
                  <select name="aspectRatio">
                    <option value="vertical">9:16</option>
                    <option value="landscape">16:9</option>
                  </select>
                </label>
              </div>
              <div class="two-col">
                <label>
                  길이(초)
                  <input name="targetDuration" type="number" min="15" max="180" value="45" required />
                </label>
                <label>
                  브랜드 색
                  <input name="brandColor" type="color" value="#146ef5" required />
                </label>
              </div>
              <label>
                원문
                <textarea name="sourceText" rows="7" required placeholder="영상으로 만들 내용을 붙여 넣으세요."></textarea>
              </label>
              <label>
                출처 URL
                <input name="sourceUrl" placeholder="https://..." />
              </label>
              <div class="two-col">
                <label>
                  이미지
                  <input name="image" type="file" accept="image/*" />
                </label>
                <label>
                  오디오
                  <input name="audio" type="file" accept="audio/*" />
                </label>
              </div>
              <div class="two-col">
                <label>
                  음성
                  <select name="voice">
                    <option value="clear-ko">Clear KO</option>
                    <option value="warm-ko">Warm KO</option>
                    <option value="documentary">Documentary</option>
                  </select>
                </label>
                <label>
                  자막
                  <select name="subtitlePreset">
                    <option value="bold-bottom">Bold Bottom</option>
                    <option value="clean-center">Clean Center</option>
                    <option value="compact-news">Compact News</option>
                  </select>
                </label>
              </div>
              <button class="primary-button" type="submit">생성</button>
            </form>
          </section>

          <section class="panel">
            <div class="section-title row-between">
              <div class="title-row">
                <span class="icon-square">P</span>
                <h2>프로젝트</h2>
              </div>
              <button class="icon-button" id="refresh-projects" type="button" title="새로고침">↻</button>
            </div>
            <div id="project-list" class="project-list"></div>
          </section>
        </aside>

        <section id="studio" class="studio panel">
          <div class="empty-state">
            <div class="empty-icon">▶</div>
            <h2>프로젝트를 선택하세요</h2>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
